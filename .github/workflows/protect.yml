# Build and check @nodatachat/protect on every push; publish it to npm, with a
# provenance attestation, when a protect-v<version> tag is pushed.
# Publishing uses npm Trusted Publishing (OIDC): no npm token is stored anywhere.

name: protect

on:
  push:
    branches: [main]
    tags: ["protect-v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/protect } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node dist/bin.js check-vectors

  publish:
    if: startsWith(github.ref, 'refs/tags/protect-v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing + provenance
    defaults: { run: { working-directory: packages/protect } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@11.21.0
      - name: The tag names the version in package.json
        run: test "protect-v$(jq -r .version package.json)" = "${GITHUB_REF_NAME}"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node dist/bin.js check-vectors
      - run: npm publish --provenance --access public
